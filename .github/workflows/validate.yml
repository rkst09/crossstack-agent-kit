name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repo-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate skills, scenarios, and local Markdown links
        run: python scripts/validate_repo.py
      - name: Test installer and validator
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/cross-stack-contract-lab/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build sample API
        run: dotnet build examples/cross-stack-contract-lab/backend/EmployeeApi/EmployeeApi.csproj --configuration Release
